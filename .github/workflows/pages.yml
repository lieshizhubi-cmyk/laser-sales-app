name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site (decode PNG icons from base64)
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js README.txt .nojekyll _site/
          for f in icons-src/*.png.b64; do base64 -d "$f" > "_site/$(basename "$f" .b64)"; done
          ls -la _site
          file _site/*.png || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
