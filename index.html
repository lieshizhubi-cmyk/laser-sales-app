<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>激光销售作战台</title>
<meta name="description" content="光纤激光切割设备销售作战台（佛山·东莞）">
<meta name="theme-color" content="#07101b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="激光作战台">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --precision-v2:#c9a46a;
  --bg:#e7ebf0; --card:#f8f9fb; --card2:#eef1f5; --text:#0c1522; --muted:#5c6a7c; --faint:#8b97a8; --line:#d5dce6;
  --pri:#12314f; --pri2:#2a5278; --priSoft:#e4ebf2; --acc:#c9a46a; --accDeep:#9a7438; --accSoft:#f6efe3;
  --ok:#1b7a54; --okSoft:#e5f3ec; --warn:#a06b12; --warnSoft:#f6edd8; --bad:#b8422a; --badSoft:#f8e8e4;
  --head1:#07101b; --head2:#12243a; --ink:#fff8ef; --shine:rgba(255,255,255,.72); --grid:rgba(18,49,79,.045);
  --shadow:0 1px 1px rgba(12,21,34,.04),0 8px 24px rgba(12,21,34,.06);
  --shadowIn:inset 0 1px 0 var(--shine);
  --r:18px; --tabh:66px;
  --ease:cubic-bezier(.22,.8,.28,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070b11; --card:#101821; --card2:#161e29; --text:#e8eef6; --muted:#9aa7b8; --faint:#6f7d90; --line:#243044;
  --pri:#8eb4d8; --pri2:#6d93b6; --priSoft:#152233; --acc:#d4b07a; --accDeep:#e0c08a; --accSoft:#2a2114;
  --ok:#4dba88; --okSoft:#10261c; --warn:#e0b15a; --warnSoft:#2a210f; --bad:#e07a64; --badSoft:#2c1612;
  --head1:#05080d; --head2:#0c1624; --ink:#f3ead8; --shine:rgba(255,255,255,.05); --grid:rgba(200,220,255,.035);
  --shadow:0 1px 1px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#070b11; --card:#101821; --card2:#161e29; --text:#e8eef6; --muted:#9aa7b8; --faint:#6f7d90; --line:#243044;
  --pri:#8eb4d8; --pri2:#6d93b6; --priSoft:#152233; --acc:#d4b07a; --accDeep:#e0c08a; --accSoft:#2a2114;
  --ok:#4dba88; --okSoft:#10261c; --warn:#e0b15a; --warnSoft:#2a210f; --bad:#e07a64; --badSoft:#2c1612;
  --head1:#05080d; --head2:#0c1624; --ink:#f3ead8; --shine:rgba(255,255,255,.05); --grid:rgba(200,220,255,.035);
  --shadow:0 1px 1px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 420px at 50% -80px, rgba(18,49,79,.08), transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 31px, var(--grid) 31px, var(--grid) 32px),
    repeating-linear-gradient(90deg, transparent, transparent 31px, var(--grid) 31px, var(--grid) 32px);
  color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-wrap:anywhere;word-break:break-word;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100vh}
/* top bar — instrument plate */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--head1),var(--head2));color:var(--ink);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(201,164,106,.28),0 8px 24px rgba(0,0,0,.18)}
.top .back{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:22px;flex:0 0 auto;cursor:pointer;transition:background .2s var(--ease)}
.top .back:active{background:rgba(255,255,255,.16)}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:17px;margin:0;line-height:1.3;font-weight:600;letter-spacing:.04em}
.top .sub{font-size:11px;letter-spacing:.08em;opacity:.62;margin-top:2px}
.top .beam{width:3px;height:28px;border-radius:2px;background:linear-gradient(var(--precision-v2),transparent);box-shadow:0 0 10px rgba(201,164,106,.7);flex:0 0 auto}
main{padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px);max-width:1180px;margin:0 auto}
/* bottom tabs — frosted instrument bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(16px);-webkit-backdrop-filter:saturate(1.2) blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -8px 24px rgba(12,21,34,.06)}
.tabs button{border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10px;letter-spacing:.04em;cursor:pointer;position:relative;transition:color .2s var(--ease)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--pri)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 2px 2px;background:var(--precision-v2);box-shadow:0 0 8px rgba(201,164,106,.55)}
.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:9px;letter-spacing:.02em;line-height:15px;min-width:15px;padding:0 4px;border-radius:8px}
@media (min-width:900px){
  .tabs{top:0;bottom:0;right:auto;width:212px;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:96px 12px 16px;box-shadow:none;background:var(--card)}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;height:48px;padding:0 14px;border-radius:12px;font-size:14px;letter-spacing:.02em}
  .tabs button.on{background:var(--priSoft);color:var(--pri)}
  .tabs button.on::before{top:12px;bottom:12px;left:0;right:auto;width:2px;height:auto;border-radius:2px}
  .tabs .badge{position:static;margin-left:auto}
  .top{padding-left:228px;z-index:40}
  main{margin-left:212px;padding:24px 28px 48px;max-width:none}
  main>.wrap{max-width:1100px;margin:0 auto}
}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow),var(--shadowIn);padding:18px;margin:0 0 16px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;letter-spacing:.03em}
.card h2 .grow{flex:1}
.card h2::before{content:"";width:2px;height:14px;border-radius:1px;background:var(--precision-v2);flex:0 0 auto;box-shadow:0 0 6px rgba(201,164,106,.45)}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:13px} .small{font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:700px){ .grid.g2{grid-template-columns:1fr 1fr} .grid.g3{grid-template-columns:1fr 1fr} }
@media (min-width:1100px){ .grid.g3{grid-template-columns:1fr 1fr 1fr} }
.grid>.card{margin:0}
/* hero — precision plate */
.hero{background:
    radial-gradient(circle at 88% 20%, rgba(201,164,106,.16), transparent 36%),
    linear-gradient(145deg,var(--head1) 0%,var(--head2) 62%,#1a3350 100%);
  color:var(--ink);border-radius:22px;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden;
  border:1px solid rgba(201,164,106,.18);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;right:-24px;top:-48px;width:190px;height:190px;border-radius:50%;border:1px solid rgba(201,164,106,.22);box-shadow:0 0 0 16px rgba(255,255,255,.04),0 0 0 32px rgba(201,164,106,.06)}
.hero::before{content:"";position:absolute;right:62px;top:0;width:1px;height:76px;background:linear-gradient(var(--precision-v2),transparent);box-shadow:0 0 12px rgba(201,164,106,.8)}
.hero .d{font-size:11px;letter-spacing:.16em;opacity:.68;font-weight:500}
.hero .t{font-size:24px;font-weight:600;margin:6px 0 4px;letter-spacing:.06em;line-height:1.25}
.hero .s{font-size:13px;opacity:.82;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow),var(--shadowIn)}
.stat .v{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.acc .v{color:var(--accDeep)} .stat.ok .v{color:var(--ok)}
/* list items */
.list{display:grid;gap:12px}
@media (min-width:900px){ .list.cols{grid-template-columns:1fr 1fr} }
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow),var(--shadowIn);cursor:pointer;position:relative;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.card .item{box-shadow:none;background:var(--card2);border-color:transparent}
.item:active{transform:scale(.987)}
.item .row1{display:flex;gap:10px;align-items:flex-start}
.item .tt{font-weight:600;font-size:15px;flex:1;line-height:1.4;letter-spacing:.01em}
.item .desc{color:var(--muted);font-size:14px;margin-top:6px;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;line-height:20px;padding:0 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
.card .item .tag{background:var(--card)}
.tag.pri{background:var(--priSoft);color:var(--pri);border-color:transparent}
.tag.acc{background:var(--accSoft);color:var(--accDeep);border-color:transparent}
.tag.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.lvl{flex:0 0 auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.04em;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.lvl.A{background:linear-gradient(180deg,#d8b57a,var(--precision-v2));color:#1a1408;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.lvl.B{background:linear-gradient(180deg,#1a3a58,#12314f);color:#f3ead8;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);letter-spacing:.02em} .kv dd{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.next{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;border:1px solid transparent}
.card .item .next{background:var(--card)}
.next .lab{color:var(--faint);letter-spacing:.06em;font-size:11px;text-transform:none;padding-top:2px}
/* score bars */
.sbars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sbar .l{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.04em;margin-bottom:4px}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--pri2);border-radius:3px}.fill.acc{background:var(--precision-v2)}
/* bars chart */
.bars{display:grid;gap:12px}
.bar .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar .l span:last-child{color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:4px}
.bar .fill{border-radius:4px}
.funnel{display:grid;gap:10px}
.fun{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.fun .lab{font-size:12px;color:var(--muted);letter-spacing:.02em}
.fun .b{height:34px;margin:0 auto;border-radius:8px;background:linear-gradient(90deg,#12314f,#2a5278);color:#f3ead8;font-size:11px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;min-width:64px;padding:0 8px;text-align:center;line-height:1.2;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.fun:last-child .b{background:linear-gradient(90deg,#9a7438,var(--precision-v2));color:#1a1408}
/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text);text-align:center;line-height:1.25;letter-spacing:.02em;transition:background .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#1a3a58,#12314f);color:#f3ead8;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn.acc{background:linear-gradient(180deg,#d8b57a,var(--precision-v2));color:#1a1408;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.icon{width:44px;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.full>.btn{flex:1 1 140px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:700px){.qa{grid-template-columns:repeat(6,1fr)}}
.qa .btn{flex-direction:column;min-height:64px;font-size:12px;gap:4px;padding:8px;letter-spacing:.02em}
.qa .btn i{font-style:normal;font-size:18px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--card2);border:1px solid var(--line);padding:4px;border-radius:16px;margin-bottom:16px}
.seg button{flex:1 1 auto;border:0;background:none;min-height:40px;padding:0 12px;border-radius:12px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.02em;transition:background .18s var(--ease),color .18s var(--ease)}
.seg button.on{background:var(--card);color:var(--pri);font-weight:600;box-shadow:var(--shadow)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.inp,select.inp,textarea.inp{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:88px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--accDeep);box-shadow:0 0 0 3px var(--accSoft)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.frow .full{grid-column:1/-1}
@media (min-width:700px){.frow.f3{grid-template-columns:1fr 1fr 1fr}}
.search{display:flex;gap:8px;margin-bottom:12px}
.search .inp{flex:1}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);z-index:25;width:56px;height:56px;border-radius:16px;border:0;background:linear-gradient(180deg,#d8b57a,var(--precision-v2));color:#1a1408;font-size:28px;box-shadow:0 8px 22px rgba(154,116,56,.38),inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;transition:transform .18s var(--ease)}
.fab:active{transform:scale(.96)}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.note{border-radius:14px;padding:12px 14px;font-size:13px;background:var(--priSoft);color:var(--text);margin-bottom:14px;border:1px solid transparent}
.note.warn{background:var(--warnSoft)} .note.bad{background:var(--badSoft)} .note.acc{background:var(--accSoft)}
.msg{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-left:2px solid var(--precision-v2);border-radius:12px;padding:14px 16px;font-size:14px;margin:8px 0 10px;line-height:1.7}
.formula{font-size:13px;background:var(--card2);border-radius:12px;padding:12px 14px;margin:8px 0;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tl{border-left:1px solid var(--line);margin-left:7px;padding-left:16px}
.tl .ev{position:relative;padding-bottom:14px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--pri2);box-shadow:0 0 0 3px var(--card)}
.tl .ev.q::before{background:var(--precision-v2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow),var(--shadowIn);cursor:pointer;text-align:left;transition:transform .18s var(--ease)}
.tile:active{transform:scale(.98)}
.tile i{font-style:normal;font-size:22px;display:block;margin-bottom:8px}
.tile b{display:block;font-size:15px;font-weight:600;letter-spacing:.02em}.tile span{font-size:12px;color:var(--muted);margin-top:4px;display:block}
.edit-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{color:var(--faint);font-size:13px;padding:22px 12px;text-align:center;letter-spacing:.02em;position:relative}
.empty::before{content:"";display:block;width:28px;height:1px;background:var(--precision-v2);margin:0 auto 12px;opacity:.7}
svg.chart{width:100%;height:auto;display:block}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(5,10,18,.52);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;display:none;flex-direction:column;box-shadow:0 -16px 40px rgba(0,0,0,.28);border:1px solid var(--line);border-bottom:0}
.sheet.show,.mask.show{display:flex}
.sheet.show{animation:sheetUp .32s var(--ease)}
.mask.show{animation:fadeIn .24s var(--ease)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .sh b{flex:1;font-size:16px;font-weight:600;letter-spacing:.03em}
.sheet .sb{padding:16px 16px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sheet .sf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--card)}
.sheet .sf .btn{flex:1}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);border-radius:20px;max-height:88vh;border-bottom:1px solid var(--line)}
  .sheet.show{animation:sheetPop .28s var(--ease)}
  @keyframes sheetPop{from{transform:translate(-50%,-46%) scale(.98);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
  .grab{display:none}
  .sheet .sh{padding:16px 18px 12px}
}

const STAGE_PTS = { 线索:5, 初步接触:12, 需求确认:22, "拜访/打样":30, 报价:38, 谈判:45, 成交:45, 流失:0 };

function scores(c){
  const bp = budgetPts(c.budget), lp = LEVEL_POT[c.level] || 0, fp = c.needFit * 5, tw = TYPE_W[c.type] || 5;
  const sp = STAGE_PTS[c.stage] || 0, tp = TIMING_PTS[c.timing] || 0, lq = LEVEL_PROB[c.level] || 0, fq = c.needFit * 3;
  const potential = bp + lp + fp + tw;
  let prob = sp + tp + lq + fq; if (c.stage === "成交") prob = 100; if (c.stage === "流失") prob = 0;
  return { potential, prob, priority: Math.round(potential * 0.5 + prob * 0.5), expected: c.budget * prob / 100, parts:{ bp, lp, fp, tw, sp, tp, lq, fq } };
}
const normName = (s) => String(s || "").replace(/示例-|有限公司|有限责任公司|公司|佛山市|东莞市|佛山|东莞|制品|厂|\s/g, "").toLowerCase();

  if (na && nb && (na === nb || (na.length >= 3 && nb.length >= 3 && (na.includes(nb) || nb.includes(na))))) r.push("公司名相近");

}

  }

}

  if (m.power >= 6000) { add("工程机械与设备制造厂", 3, m.power + "W 高功率切厚壁"); add("激光加工服务商", 2, "能接厚料订单"); add("汽车零部件厂", 1, "高节拍"); }

  return Object.values(s).sort((a, b) => b.score - a.score);
}

    <label class="fld"><span>城市</span><select class="inp" data-flt="city">${opt(["全部","佛山","东莞"], f.city)}</select></label>

    <label class="fld"><span>阶段</span><select class="inp" data-flt="stage">${opt(["全部"].concat(STAGES), f.stage)}</select></label>
    <label class="chk full"><input type="checkbox" data-flt="dup" ${f.dup ? "checked" : ""}> 只看疑似重复</label></div>
    <div class="btns"><button class="btn sm" data-act="resetFilter">清除筛选</button><button class="btn sm" data-act="showFormula">评分与去重规则</button></div></div>`;
  h += `<div class="seg">${[["priority","综合优先"],["potential","大单潜力"],["prob","成交可能"],["next","下一步日期"],["last","最近联系"]].map((x) => `<button class="${UI.sort === x[0] ? "on" : ""}" data-act="sort" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;
  h += `<div id="clist">${custListHtml()}</div>`;
  h += `<button class="fab" data-act="newCust" aria-label="新增客户">＋</button>`;
  return h;
}
function vCustDetail(c){
  const s = scores(c), dupes = findDupes(S.customers), t = todayStr();
  let h = `<div class="card"><div class="row1" style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><div style="font-size:18px;font-weight:700;line-height:1.35">${esc(c.name)}</div><div class="tags">${tag(c.type)}${tag(c.city + "·" + c.district)}${stageTag(c.stage)}${c.sample ? tag("示例数据", "acc") : ""}</div></div><div class="lvl ${c.level}" style="width:40px;height:40px;font-size:18px">${c.level}</div></div>
    ${dupes[c.id] ? `<div class="note warn" style="margin-top:12px">疑似重复：${esc(dupes[c.id].join("；"))}</div>` : ""}
    <div class="qa" style="margin-top:14px">
      <button class="btn" data-act="editCust" data-id="${c.id}"><i>✏️</i>编辑</button>
      <button class="btn" data-act="contacted" data-id="${c.id}"><i>✅</i>今天已联系</button>
      <button class="btn" data-act="addVisit" data-id="${c.id}"><i>📝</i>记拜访</button>
      <button class="btn" data-act="addQuote" data-id="${c.id}"><i>💰</i>记报价</button>
      <button class="btn" data-act="goPrep" data-id="${c.id}"><i>📋</i>拜访清单</button>
      <button class="btn" data-act="goScripts" data-id="${c.id}"><i>💬</i>看话术</button>
    </div></div>`;
  h += `<div class="grid g2"><div class="card"><h2>推进</h2><div class="frow">
    <label class="fld"><span>阶段</span><select class="inp" data-cf="stage" data-id="${c.id}">${opt(STAGES, c.stage)}</select></label>
    <label class="fld"><span>等级</span><select class="inp" data-cf="level" data-id="${c.id}">${opt(LEVELS, c.level)}</select></label>
    <label class="fld full"><span>下一步日期</span><input class="inp" type="date" data-cf="nextDate" data-id="${c.id}" value="${esc(c.nextDate)}"></label>
    <label class="fld full"><span>下一步行动</span><textarea class="inp" data-cf="nextAction" data-id="${c.id}" rows="2">${esc(c.nextAction)}</textarea></label></div>
    <div class="faint">最近联系：${esc(c.lastContact || "无")}${c.lastContact ? "（" + diffDays(t, c.lastContact) + " 天前）" : ""}</div></div>`;
  h += `<div class="card"><h2>评分</h2><div class="sbars" style="margin-top:0"><div class="sbar"><div class="l"><span>大单潜力</span><span>${s.potential}/100</span></div><div class="track"><div class="fill" style="width:${s.potential}%"></div></div></div><div class="sbar"><div class="l"><span>成交可能</span><span>${s.prob}%</span></div><div class="track"><div class="fill acc" style="width:${s.prob}%"></div></div></div></div>
    <dl class="kv" style="margin-top:12px"><dt>预算分</dt><dd>${s.parts.bp}</dd><dt>等级分</dt><dd>${s.parts.lp}（潜力） / ${s.parts.lq}（可能性）</dd><dt>需求匹配</dt><dd>${c.needFit}/5 → ${s.parts.fp} / ${s.parts.fq}</dd><dt>行业权重</dt><dd>${s.parts.tw}</dd><dt>阶段分</dt><dd>${s.parts.sp}</dd><dt>采购时间分</dt><dd>${s.parts.tp}</dd><dt>综合优先级</dt><dd><b>${s.priority}</b></dd><dt>预期金额</dt><dd>${wan(s.expected)}</dd></dl></div></div>`;
  const info = [["联系人", c.contact], ["电话", c.phone], ["微信", c.wechat], ["官网", c.website], ["主营产品", c.products], ["设备需求", c.need], ["现有设备", c.existing], ["预算", wan(c.budget)], ["采购时间", c.timing], ["来源", c.source], ["录入日期", c.createdAt], ["备注", c.note]];
  h += `<div class="grid g2"><div class="card"><h2>档案</h2><dl class="kv">${info.map((x) => `<dt>${x[0]}</dt><dd>${esc(x[1] || "—")}</dd>`).join("")}</dl>
    <div class="btns" style="margin-top:12px">${c.phone ? copyBtn(c.phone, "复制电话") : ""}${c.wechat ? copyBtn(c.wechat, "复制微信") : ""}</div></div>`;
  const rec = recommendFor(c).slice(0, 2);
  h += `<div class="card"><h2>推荐机型</h2>${rec.length ? `<div class="list">${rec.map((r) => `<div class="item" data-act="openModel" data-id="${r.m.id}"><div class="row1"><div class="tt">${esc(r.m.name)}</div>${tag("匹配 " + r.s, "pri")}</div><div class="desc">${esc(r.why.slice(0, 4).join("；") || "—")}</div></div>`).join("")}</div>` : `<div class="empty">先在设备页录入机型。</div>`}</div></div>`;
  const ev = S.visits.filter((v) => v.customerId === c.id).map((v) => ({ d:v.date, k:v.kind, t:v.summary, n:v.next, q:false })).concat(S.quotes.filter((q) => q.customerId === c.id).map((q) => ({ d:q.date, k:"报价", t:q.model + " · " + wan(q.price) + " · 让利" + q.discount + "%", n:q.status, q:true }))).sort((a, b) => b.d.localeCompare(a.d));
  if (ev.length) h += `<div class="card"><h2>沟通与报价记录</h2><div class="tl">${ev.map((e) => `<div class="ev ${e.q ? "q" : ""}"><div class="faint">${esc(e.d)} · ${esc(e.k)}</div><div>${esc(e.t)}</div>${e.n ? `<div class="faint">→ ${esc(e.n)}</div>` : ""}</div>`).join("")}</div></div>`;
  h += `<div class="btns full"><button class="btn bad" data-act="delCust" data-id="${c.id}">删除该客户</button></div>`;
  return h;
}

/* ===== 跟进：提醒/漏斗/拜访/报价/复盘 ===== */
function vFollow(){
  const segs = [["remind","提醒"],["funnel","漏斗"],["visit","拜访"],["quote","报价"],["review","复盘"]];
  let h = `<div class="seg">${segs.map((x) => `<button class="${UI.follow === x[0] ? "on" : ""}" data-act="follow" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>`;
  const dupes = findDupes(S.customers);
  if (UI.follow === "remind") {
    const r = reminders(), grp = [["已逾期", r.filter((x) => x.d < 0)], ["今天", r.filter((x) => x.d === 0)], ["未来 7 天", r.filter((x) => x.d > 0)]];
    grp.forEach((g) => { h += `<div class="card"><h2>${g[0]}<span class="grow"></span>${tag(g[1].length + " 项")}</h2>${g[1].length ? `<div class="list cols">${g[1].map((x) => custCard(x.c, dupes)).join("")}</div>` : `<div class="empty">无</div>`}</div>`; });
  }
  if (UI.follow === "funnel") {
    const data = STAGES.filter((s) => s !== "流失").map((s) => { const l = S.customers.filter((c) => c.stage === s); return { s, n:l.length, v:l.reduce((a, c) => a + c.budget, 0) }; });
    const max = Math.max(1, ...data.map((d) => d.n)), lost = S.customers.filter((c) => c.stage === "流失");
    h += `<div class="card"><h2>销售漏斗</h2><div class="funnel">${data.map((d) => `<div class="fun"><div class="lab">${d.s}</div><div class="b" style="width:${Math.max(28, d.n / max * 100)}%">${d.n}家 · ${wan(d.v)}</div></div>`).join("")}</div>
      <div class="faint" style="margin-top:10px">流失 ${lost.length} 家（预算 ${wan(lost.reduce((a, c) => a + c.budget, 0))}）· 整体转化 ${S.customers.length ? Math.round(data[data.length - 1].n / S.customers.length * 100) : 0}% · 条宽=客户数，金额=预算合计</div></div>`;
    h += `<div class="grid g2"><div class="card"><h2>各阶段预期金额</h2>${bars(STAGES.slice(0, 6).map((s) => { const v = S.customers.filter((c) => c.stage === s).reduce((a, c) => a + scores(c).expected, 0); return { label:s, value:v, display:wan(v) }; }))}<div class="faint" style="margin-top:8px">预期金额 = 预算 × 成交可能性</div></div>`;
    const bt = TYPES.map((t) => ({ label:t, value:active().filter((c) => c.type === t).length })).filter((x) => x.value).sort((a, b) => b.value - a.value).map((x) => Object.assign(x, { display:x.value + " 家" }));
    h += `<div class="card"><h2>在跟客户按类型</h2>${bt.length ? bars(bt, true) : `<div class="empty">无</div>`}</div></div>`;
  }
  if (UI.follow === "visit") {
    h += `<div class="btns full" style="margin-bottom:12px"><button class="btn acc" data-act="addVisit">＋ 新增拜访/沟通记录</button></div>`;
    const v = S.visits.slice().sort((a, b) => b.date.localeCompare(a.date));
    h += v.length ? `<div class="list cols">${v.map((x) => `<div class="item" style="cursor:default"><div class="row1"><div class="tt">${esc(cName(x.customerId))}</div>${tag(x.kind, "pri")}</div><div class="faint">${esc(x.date)}${x.sample ? " · 示例" : ""}</div><div class="desc">${esc(x.summary)}</div>${x.next ? `<div class="next"><span class="lab">下一步</span><span>${esc(x.next)}</span></div>` : ""}<div class="edit-acts"><button class="btn sm" data-act="editVisit" data-id="${x.id}">编辑</button><button class="btn sm bad" data-act="delVisit" data-id="${x.id}">删除</button></div></div>`).join("")}</div>` : `<div class="card empty">还没有拜访记录。</div>`;
  }
  if (UI.follow === "quote") {
    h += `<div class="btns full" style="margin-bottom:12px"><button class="btn acc" data-act="addQuote">＋ 新增报价</button></div>`;
    const q = S.quotes.slice().sort((a, b) => b.date.localeCompare(a.date));
    h += q.length ? `<div class="list cols">${q.map((x) => { const m = S.models.find((y) => y.name === x.model), net = x.price * (1 - x.discount / 100), profit = m ? m.profit - (x.price - net) : null; return `<div class="item" style="cursor:default"><div class="row1"><div class="tt">${esc(cName(x.customerId))}</div>${tag(x.status, x.status === "已接受" ? "ok" : x.status === "已拒绝" ? "bad" : "pri")}</div><div class="desc">${esc(x.model)}</div><div class="meta"><span>报价 <b>${wan(x.price)}</b></span><span>让利 <b>${x.discount}%</b></span><span>成交价 <b>${wan(net)}</b></span><span>预计代理利润 <b>${profit == null ? "—" : wan(profit)}</b></span></div><div class="faint">${esc(x.date)}${x.note ? " · " + esc(x.note) : ""}${x.sample ? " · 示例" : ""}</div><label class="fld" style="margin:10px 0 0"><span>状态</span><select class="inp" data-qs="${x.id}">${opt(QUOTE_STATUS, x.status)}</select></label><div class="edit-acts"><button class="btn sm" data-act="editQuote" data-id="${x.id}">编辑</button><button class="btn sm bad" data-act="delQuote" data-id="${x.id}">删除</button></div></div>`; }).join("")}</div><div class="faint" style="margin-top:8px">预计代理利润 = 机型库代理利润 − 让利金额</div>` : `<div class="card empty">还没有报价记录。</div>`;
  }
  if (UI.follow === "review") {
    h += `<div class="btns full" style="margin-bottom:12px"><button class="btn acc" data-act="addReview">＋ 新增成交复盘</button></div>`;
    const r = S.reviews.slice().sort((a, b) => b.date.localeCompare(a.date));
    if (r.length) {
      const m = {}; r.forEach((x) => { const k = x.result + "·" + x.reason; m[k] = (m[k] || 0) + 1; });
      const won = r.filter((x) => x.result === "成交").length;
      h += `<div class="card"><h2>赢单/丢单原因</h2><div class="stats" style="margin-bottom:12px">${stat(Math.round(won / r.length * 100) + "%", "赢单率", "ok")}${stat(won + " / " + r.length, "成交 / 复盘")}</div>${bars(Object.keys(m).map((k) => ({ label:k, value:m[k], display:m[k] + " 单" })).sort((a, b) => b.value - a.value))}</div>`;
      h += `<div class="list cols">${r.map((x) => `<div class="item" style="cursor:default"><div class="row1"><div class="tt">${esc(cName(x.customerId))}</div>${tag(x.result, x.result === "成交" ? "ok" : "bad")}</div><div class="meta"><span>原因 <b>${esc(x.reason)}</b></span>${x.amount ? `<span>金额 <b>${wan(x.amount)}</b></span>` : ""}${x.competitor ? `<span>对手 <b>${esc(x.competitor)}</b></span>` : ""}</div>${x.lessons ? `<div class="desc">💡 ${esc(x.lessons)}</div>` : ""}<div class="faint">${esc(x.date)}${x.sample ? " · 示例" : ""}</div><div class="edit-acts"><button class="btn sm bad" data-act="delReview" data-id="${x.id}">删除</button></div></div>`).join("")}</div>`;
    } else h += `<div class="card empty">还没有复盘记录。</div>`;
  }
  return h;
}
</script>
<script>
"use strict";
/* ===== 话术手册（可编辑） ===== */
const getList = (scope, key) => (scope === "_shared" ? S.scripts[key] : S.scripts.byType[scope][key]);
function setList(scope, key, arr){ if (scope === "_shared") S.scripts[key] = arr; else S.scripts.byType[scope][key] = arr; }
function itemText(key, x, cust){
  if (key === "msgs") return fillMsg(x.a, cust);
  if (key === "faq") return "问：" + x.t + "\n答：" + x.a;
  if (key === "objections") return "客户说：" + x.t + "\n思路：" + x.a + "\n话术：" + x.b;
  if (key === "tech") return x.t + "：" + x.a;
  if (key === "pitch") return x.a;
  return x.t;
}
function scriptCard(scope, key, cust){
  const L = LISTS[key], arr = getList(scope, key), ed = UI.edit;
  let h = `<div class="card" id="sc-${key}"><h2>${esc(L.label)}<span class="grow"></span>${ed ? `<button class="btn sm" data-act="sAdd" data-scope="${esc(scope)}" data-key="${key}">＋ 新增</button><button class="btn sm ghost" data-act="sReset" data-scope="${esc(scope)}" data-key="${key}">恢复默认</button>` : ""}</h2>`;
  if (!arr.length) return h + `<div class="empty">暂无内容${ed ? "，点“新增”添加。" : "，打开右上角“编辑话术”添加。"}</div></div>`;
  h += `<div class="list">`;
  arr.forEach((x, i) => {
    const acts = ed ? `<div class="edit-acts"><button class="btn sm icon" data-act="sMove" data-scope="${esc(scope)}" data-key="${key}" data-id="${x.id}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="上移">↑</button><button class="btn sm icon" data-act="sMove" data-scope="${esc(scope)}" data-key="${key}" data-id="${x.id}" data-dir="1" ${i === arr.length - 1 ? "disabled" : ""} aria-label="下移">↓</button><button class="btn sm" data-act="sEdit" data-scope="${esc(scope)}" data-key="${key}" data-id="${x.id}">编辑</button><button class="btn sm bad" data-act="sDel" data-scope="${esc(scope)}" data-key="${key}" data-id="${x.id}">删除</button></div>` : (L.copy ? `<div class="edit-acts">${copyBtn(itemText(key, x, cust))}</div>` : "");
    let body = "";
    if (key === "msgs") body = `<div class="tt">${esc(x.t)}</div><div class="msg">${esc(ed ? x.a : fillMsg(x.a, cust))}</div>`;
    else if (key === "pitch") body = `<div class="tt">${esc(x.t)}</div><div class="desc" style="color:var(--text)">${esc(x.a)}</div>`;
    else if (key === "faq") body = `<div class="tt">❓ ${esc(x.t)}</div><div class="desc">${esc(x.a)}</div>`;
    else if (key === "objections") body = `<div class="tt">🗣️ “${esc(x.t)}”</div><div class="desc"><b>思路：</b>${esc(x.a)}</div><div class="desc" style="color:var(--text)"><b>话术：</b>${esc(x.b)}</div>`;
    else if (key === "tech") body = `<div class="tt">${esc(x.t)}</div><div class="desc">${esc(x.a)}</div>`;
    else body = `<div class="tt" style="font-weight:500">${key === "qualify" || key === "general" ? (i + 1) + ". " : "• "}${esc(x.t)}</div>`;
    h += `<div class="item" style="cursor:default">${body}${acts}</div>`;
  });
  h += `</div>`;
  if (!ed && (key === "qualify" || key === "general")) h += `<div class="btns" style="margin-top:10px">${copyBtn(arr.map((x, i) => (i + 1) + ". " + x.t).join("\n"), "复制全部问题")}</div>`;
  return h + `</div>`;
}
function vScripts(){
  const cust = UI.pbCust ? cById(UI.pbCust) : null, t = UI.pbType;
  let h = `<div class="card"><div class="frow">
    <label class="fld"><span>客户类型</span><select class="inp" id="pbType">${opt(TYPES, t)}</select></label>
    <label class="fld"><span>带入客户（自动填称呼）</span><select class="inp" id="pbCust">${opt([{ v:"", l:"不指定" }].concat(S.customers.map((c) => ({ v:c.id, l:c.name }))), UI.pbCust)}</select></label>
    <label class="fld"><span>我的名字</span><input class="inp" data-me="name" value="${esc(S.me.name)}"></label>
    <label class="fld"><span>我的公司</span><input class="inp" data-me="company" value="${esc(S.me.company)}"></label></div>
    <div class="btns full"><button class="btn ${UI.edit ? "acc" : "pri"}" data-act="toggleEdit">${UI.edit ? "✓ 完成编辑" : "✏️ 编辑话术（增删改、排序）"}</button></div>
    ${UI.edit ? `<div class="note acc" style="margin:12px 0 0">编辑模式：每条可上移/下移/编辑/删除；每类可“恢复默认”。改动自动保存在本机。行业类内容只改当前选中的「${esc(t)}」。</div>` : `<div class="faint" style="margin-top:10px">复制按钮只把文字放进剪贴板，由你自己发送，本应用不会联系任何客户。</div>`}</div>`;
  h += `<div class="grid g2">`;
  TYPE_LIST_ORDER.forEach((k) => { h += scriptCard(t, k, cust); if (k === "qualify") h += scriptCard("_shared", "general", cust); });
  h += `</div>`;
  h += scriptCard("_shared", "objections", cust) + scriptCard("_shared", "tech", cust);
  if (UI.edit) h += `<div class="btns full"><button class="btn bad" data-act="sResetAll">全部话术恢复默认（所有行业）</button></div>`;
  return h;
}

/* ===== 设备型号库 ===== */
function vModels(){
  let h = S.models.some((m) => m.sample) ? `<div class="note">带“示例”的机型参数只是模板，不是伟卓 WZ 实际参数。请按公司资料录入真实型号、参数、价格和代理利润，再删除示例。</div>` : "";
  h += S.models.length ? `<div class="list cols">${S.models.map((m) => { const f = matchModel(m).slice(0, 3); return `<div class="item" data-act="openModel" data-id="${m.id}"><div class="row1"><div class="tt">${esc(m.name)}</div>${m.sample ? tag("示例", "acc") : ""}</div>
    <div class="tags">${tag(m.kind, "pri")}${tag(m.power + "W")}${m.tubeMax ? tag("管径 " + m.tubeMin + "–" + m.tubeMax + "mm") : ""}${m.tubeLen ? tag(m.tubeLen + "m") : ""}${m.bevel ? tag("坡口", "acc") : ""}${m.autoLoad ? tag("自动上料", "ok") : ""}</div>
    <div class="meta"><span>售价 <b>${wan(m.price)}</b></span><span>代理利润 <b>${wan(m.profit)}</b></span><span>毛利率 <b>${m.price ? Math.round(m.profit / m.price * 100) : 0}%</b></span></div>
    <div class="next"><span class="lab">最适合</span><span>${esc(f.map((x) => x.type).join("、"))}</span></div></div>`; }).join("")}</div>` : `<div class="card empty">还没有机型，点右下角＋录入。</div>`;
  return h + `<button class="fab" data-act="newModel" aria-label="新增机型">＋</button>`;
}

  else if (el.id === "f_city") { $("#f_district").innerHTML = opt(DISTRICTS[el.value] || [], (DISTRICTS[el.value] || [])[0]); }
  else if (el.id === "f_result") { $("#f_reason").innerHTML = opt(el.value === "流失" ? LOSS_REASONS : WIN_REASONS, ""); }
  else if (el.id === "f_model") { const m = S.models.find((x) => x.name === el.value); if (m && $("#f_price")) $("#f_price").value = m.price; }
  else if (el.id === "importFile" && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(el.files[0]); el.value = ""; }
});

/* ===== 启动 ===== */
save(); render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
